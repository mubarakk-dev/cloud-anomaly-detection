services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard.py:/app/dashboard.py:ro
    profiles: ["dashboard"]
